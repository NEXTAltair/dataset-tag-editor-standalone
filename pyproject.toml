[project]
name = "dataset-tag-editor"
version = "0.1.0"
description = "Dataset tag editor with image interrogator support"
requires-python = ">=3.12"
dependencies = [
    "gradio",
    "transformers",
    "requests",
    "pillow",
    "numpy",
    "timm",
    "print-color",
]

[project.optional-dependencies]
# 開発用
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.9",
    "isort>=5.13.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/dataset_tag_editor", "userscripts"]

[project.scripts]
dataset-tag-editor = "scripts.interface:main"

[project.urls]
Homepage = "https://github.com/toshiaki1729/dataset-tag-editor-standalone"
Documentation = "https://github.com/toshiaki1729/dataset-tag-editor-standalone/blob/main/README.md"
Repository = "https://github.com/toshiaki1729/dataset-tag-editor-standalone.git"
