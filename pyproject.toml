[project]
name = "dataset-tag-editor-standalone"
version = "0.1.0"
description = "Dataset tag editor with image interrogator support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "image-annotator-lib[dev]",
    "gradio",
    "transformers",
    "requests",
    "pillow",
    "numpy",
    "timm",
    "print-color",
    "anthropic",
    "openai",
    "google",
]

[tool.uv.sources]
image-annotator-lib = { path = "image-annotator-lib", editable = true }

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-bdd>=8.0.0",
    "pytest-clarity>=1.0.1",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-playwright",
    "pytest-mock",
    "toml",

    # Code Quality
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "types-requests>=2.32.0",
    "types-Pillow",
    "types-toml",
    "types-psutil",

    # Utilities
    "tensorflow",
    "psutil",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "base_loader: mark test related to base loader",
    "transformers_loader: mark test related to transformers loader",
    "transformers_pipeline_loader: mark test related to transformers pipeline loader",
    "onnx_loader: mark test related to onnx loader",
    "tensorflow_loader: mark test related to tensorflow loader",
    "clip_loader: mark test related to clip loader",
    "memory_management: mark test related to memory management",
    "cache_control: mark test related to cache control",
    "cuda_management: mark test related to cuda management",
    "error_handling: mark test related to error handling",
    "scorer_registry: mark test related to scorer registry",
    "scorer: mark test related to scorer",
    "tagger: mark test related to tagger",
    "aesthetic_score_models: mark test related to aesthetic score models",
]
# addopts = "-ra -q" # 必要であれば追加

[tool.ruff]
# Lint Rules: https://docs.astral.sh/ruff/rules/
# Format Options: https://docs.astral.sh/ruff/formatter/
line-length = 320
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "RUF021", # カタカナの `ノ` でなにか言われるのを回避
]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
warn_redundant_casts = true
warn_unreachable = true
warn_no_return = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/dataset_tag_editor", "userscripts"]

[project.scripts]
dataset-tag-editor = "scripts.interface:main"

[project.urls]
Homepage = "https://github.com/toshiaki1729/dataset-tag-editor-standalone"
Documentation = "https://github.com/toshiaki1729/dataset-tag-editor-standalone/blob/main/README.md"
Repository = "https://github.com/toshiaki1729/dataset-tag-editor-standalone.git"
